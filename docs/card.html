<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プロフィールカード｜フリーセラピスト掲示板（デモ）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="age-gate">
  <div class="gate-box">
    <div class="gate-logo">フリーセラピスト掲示板<span>（デモ）</span></div>
    <p class="gate-lead">このサイトはフリーセラピストの宣伝リンク集です。成人向けの内容を含む場合があります。</p>
    <p class="gate-q">あなたは18歳以上ですか？</p>
    <button id="gate-yes" class="gate-btn yes">はい、18歳以上です</button>
    <button id="gate-no" class="gate-btn no">いいえ</button>
    <p id="gate-msg" class="gate-msg"></p>
    <p class="gate-note">※これはデモサイトです。掲載者・店舗・数値はすべて架空で、写真はAI生成画像を使用しています。</p>
  </div>
</div>
<div class="demo-banner">デモサイトです。掲載者・店舗・数値はすべて架空で、外部リンクはすべてダミーです。</div>
<div class="wrap">
  <main id="detail"></main>
  <a class="back" href="index.html">← 掲示板にもどる</a>
  <footer class="site">
    <nav class="footer-links"><a href="terms.html">利用規約（仮）</a><a href="report.html">通報・削除の窓口</a><a href="about.html">運営者情報</a></nav>
    このカードが掲載の本体です。掲示板の一覧はこのカードの内容をそのまま表示しています。<br>
    連絡・予約・決済は各リンク先（本人のページ）で行われます。写真はAI生成画像です。
  </footer>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
var id = +new URLSearchParams(location.search).get('id') || 1;
var p = PEOPLE.find(function (x) { return x.id === id; }) || PEOPLE[0];
document.title = p.name + '｜プロフィールカード（デモ）';

var liked = getStore('liked_' + p.id, false);
var faved = getStore('fav_' + p.id, false);

var el = document.getElementById('detail');
el.innerHTML =
  '<header class="site" style="text-align:left">' +
  '<div class="logo" style="font-size:20px">' + p.name + ' <span style="margin:0;font-size:13px;color:var(--sub)">' + p.age + '歳｜' + p.area + '</span></div>' +
  '<p class="tagline" style="text-align:left">' + p.shop + '｜<span class="update-note" id="upd-note">更新しました：' + p.updatedLabel + '（' + relTime(p.updatedMin) + '）</span></p>' +
  (p.openToday ? '<p id="open-slot" style="margin-top:6px"><span class="open-badge" style="position:static">本日営業中（掲載者申告）</span></p>' : '<p id="open-slot" style="margin-top:6px;display:none"><span class="open-badge" style="position:static">本日営業中（掲載者申告）</span></p>') +
  '</header>' +
  '<div class="photo-row">' +
  p.photos.map(function (src) {
    return '<span class="photo-cell"><img src="' + src + '" alt="' + p.name + 'の写真（AI生成）" data-name="' + p.name + '" data-color="' + phColor(p.id) + '" onerror="imgFallback(this)"><span class="ai-label">AI生成</span></span>';
  }).join('') +
  '</div>' +
  '<p style="font-size:11px;color:var(--sub);margin-top:6px">※ 写真はAI生成画像です（実在の人物ではありません）。</p>' +
  '<div style="margin-top:10px;font-size:13px">' + starText(p.stars) +
  ' <span style="font-size:11px;color:var(--sub)">本人のおすすめ度（掲載者自己申告）｜今日の気分 ' + p.mood + (p.streak ? '｜更新 ' + p.streak + '日連続' : '') + '</span></div>' +
  '<div class="btn-row">' +
  '<button class="btn" id="like-btn">♥ いいね <span id="like-num">' + (p.likes + (liked ? 1 : 0)) + '</span></button>' +
  '<button class="btn" id="fav-btn">★ お気に入り</button>' +
  '<button class="btn primary" id="share-btn">シェア</button>' +
  '</div>' +
  '<section class="block"><h2>プロフィール</h2><dl class="kv">' +
  '<dt>名前</dt><dd>' + p.name + '</dd>' +
  '<dt>職種</dt><dd>' + p.job + '（選択式：カードは職種を選べる汎用基盤です）</dd>' +
  '<dt>活動形態</dt><dd>' + p.work + '</dd>' +
  '<dt>エリア</dt><dd>' + p.area + '</dd>' +
  '<dt>身長</dt><dd>' + p.height + '</dd>' +
  '<dt>タグ</dt><dd>' + p.tags.join('／') + '</dd>' +
  '<dt>ひとこと</dt><dd>' + p.style + '</dd>' +
  '</dl></section>' +
  '<section class="block"><h2>所属店舗</h2><dl class="kv">' +
  '<dt>店舗名</dt><dd>' + p.shop + '</dd></dl>' +
  '<div class="ext-links" style="margin-top:10px"><a data-ext="shop">店舗ページを見る（外部リンク・ダミー）<span class="cnt"></span></a></div></section>' +
  '<section class="block"><h2>写メ日記（外部ページへのリンク）</h2><ul class="diary-list">' +
  '<li data-diary class="diary-latest"><span class="d-date">' + p.diary[0].date + '</span>' + p.diary[0].title + ' <span class="latest-badge">最新</span></li>' +
  '</ul>' +
  (p.diary.length > 1 ?
    '<details class="diary-more"><summary>過去の日記を見る（' + (p.diary.length - 1) + '件）</summary><ul class="diary-list">' +
    p.diary.slice(1).map(function (d) {
      return '<li data-diary><span class="d-date">' + d.date + '</span>' + d.title + '</li>';
    }).join('') +
    '</ul></details>' : '') +
  '</section>' +
  '<section class="block"><h2>その他のリンク（外部）</h2><div class="ext-links">' +
  p.links.map(function (l) {
    return '<a data-ext="' + l.type + '">' + l.label + '<span class="cnt" data-cnt="' + l.type + '"></span></a>';
  }).join('') +
  '</div><p style="font-size:11px;color:var(--sub);margin-top:8px">※ 外部リンクは計測用の中継を経由する設計です（デモでは端末内でクリック数を数えています）。</p></section>';

var likeBtn = document.getElementById('like-btn');
function paintLike() {
  document.getElementById('like-num').textContent = p.likes + (liked ? 1 : 0);
  likeBtn.classList.toggle('active', liked);
}
likeBtn.addEventListener('click', function () {
  liked = !liked; setStore('liked_' + p.id, liked); paintLike();
});
paintLike();
var favBtn = document.getElementById('fav-btn');
function paintFav() { favBtn.classList.toggle('active', faved); favBtn.textContent = faved ? '★ お気に入り済み' : '★ お気に入り'; }
favBtn.addEventListener('click', function () {
  faved = !faved; setStore('fav_' + p.id, faved); paintFav();
  toast(faved ? 'お気に入りに保存しました（端末内）' : 'お気に入りを解除しました');
});
paintFav();
document.getElementById('share-btn').addEventListener('click', function () {
  var url = location.href;
  if (navigator.share) {
    navigator.share({ title: document.title, url: url }).catch(function () {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url);
    toast('カードのURLをコピーしました');
  } else {
    toast('カードURL：' + url);
  }
});
// 外部リンク：計測（端末内カウント）→デモのため遷移はしない
function paintCounts() {
  document.querySelectorAll('[data-cnt]').forEach(function (s) {
    var n = getStore('clicks_' + p.id + '_' + s.dataset.cnt, 0);
    s.textContent = n ? 'あなたの端末でのクリック ' + n + '回' : '';
  });
}
document.querySelectorAll('[data-ext]').forEach(function (a) {
  a.addEventListener('click', function () {
    countClick(p.id, a.dataset.ext);
    paintCounts();
    toast('デモのため外部ページには移動しません（クリックを計測しました）');
  });
});
document.querySelectorAll('[data-diary]').forEach(function (li) {
  li.addEventListener('click', function () {
    countClick(p.id, 'blog');
    toast('デモのため外部ページには移動しません（クリックを計測しました）');
  });
});
// ダッシュボード連動（端末内保存）：営業中バッジと更新時刻へ反映
var cst = getCardState(p.id);
if (cst) {
  if (typeof cst.open === 'boolean') {
    var slot = document.getElementById('open-slot');
    if (slot) slot.style.display = cst.open ? '' : 'none';
  }
  if (cst.updatedAt) {
    var un = document.getElementById('upd-note');
    if (un) un.textContent = '更新しました：たった今（' + relTime(Math.max(0, Math.round((Date.now() - cst.updatedAt) / 60000))) + '）';
  }
}
paintCounts();
</script>
</body>
</html>
